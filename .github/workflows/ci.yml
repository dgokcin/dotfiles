name: CI

on:
  pull_request: # runs from the merge commit so new checks register on the PR
  push:
    branches: [main]
  schedule:
    # Thursday 05:00 UTC — catch dead brew packages and broken install targets.
    - cron: "0 5 * * 4"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/actionlint
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  setup:
    name: Install and Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install into an isolated home
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/dotfiles-home/.config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          make install-ci
          make verify-install

      - name: Brewfile health
        env:
          FAIL_STALE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: make brew-health
