name: Dotfiles

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-lint-test:
    name: Linux — lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/actionlint
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  linux-install:
    name: Linux — isolated install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install into an isolated home
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/dotfiles-home/.config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          make install-ci
          make verify-install

  macos-brew-cursor:
    name: macOS — Brewfile and Cursor
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cursor user settings land under ~/Library on Darwin; Linux CI cannot
      # cover that path. Everything else in install-ci already ran on Ubuntu.
      - name: Link Cursor user settings
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/dotfiles-home/.config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          make cursor-user-config
          test -L "$HOME/Library/Application Support/Cursor/User/settings.json"
          test -L "$HOME/Library/Application Support/Cursor/User/keybindings.json"

      - name: Check Brewfile packages
        env:
          FAIL_STALE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: make brew-health
