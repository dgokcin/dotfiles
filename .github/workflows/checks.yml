name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/actionlint
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  setup:
    name: Isolated install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install into an isolated home
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/dotfiles-home/.config
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          make install-ci
          make verify-install

  brew:
    name: Brewfile health
    runs-on: macos-latest
    if: vars.ENABLE_MACOS_CI == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brewfile health
        env:
          FAIL_STALE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: make brew-health
