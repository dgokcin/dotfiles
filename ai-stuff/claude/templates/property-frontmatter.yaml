# Property Note Frontmatter Schema
# Use this schema when creating property notes in Obsidian

tags:
  - house-search
  - property
address: "<street> <number>"
postcode: "<1234 AB>"
city: Amsterdam
neighborhood: "<neighborhood name>"
price: <number>
price_per_m2: <number>
size_m2: <number>
rooms: <number>
bedrooms: <number>
energy_label: "<A/B/C/D/E/F/G>"
year_built: <number>
ownership: "<full ownership|leasehold>"
erfpacht: <true/false>
erfpacht_canon: <annual amount or null>
vve_monthly: <number>
floor: <number>
tier: "<strong-buy|buy|watch|skip>"
status: "<available|sold|withdrawn>"
listed_since: <YYYY-MM-DD>
found_date: <YYYY-MM-DD>
funda_id: <number>
funda_url: "<url>"
agent: "<agent name>"
agent_phone: "<phone>"

# Viewing tracking
viewing_requested: <true/false>
viewing_requested_date: <YYYY-MM-DD or null>
viewing_scheduled: <YYYY-MM-DD or null>
viewing_notes: "<notes from viewing>"
